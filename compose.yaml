services:
  postgres:
    build:
      context: .
      dockerfile: docker/postgres/Dockerfile
    image: enterprise-knowledge-postgres:pg16-vector0.8.6-search0.25.11
    # Init scripts do not run for existing data volumes; preload explicitly.
    command: ["postgres", "-c", "shared_preload_libraries=pg_search"]
    container_name: enterprise-knowledge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - enterprise_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  milvus-etcd:
    image: quay.io/coreos/etcd:v3.5.25
    container_name: enterprise-knowledge-milvus-etcd
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: [etcd, --advertise-client-urls=http://milvus-etcd:2379, --listen-client-urls=http://0.0.0.0:2379, --data-dir=/etcd]
    volumes:
      - enterprise_milvus_etcd:/etcd
    healthcheck:
      test: [CMD, etcdctl, endpoint, health]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  milvus-minio:
    image: milvusdb/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: enterprise-knowledge-milvus-minio
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    command: [minio, server, /minio_data, --console-address, ':9001']
    volumes:
      - enterprise_milvus_minio:/minio_data
    healthcheck:
      test: [CMD, mc, ready, local]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  milvus-volume-init:
    image: registry.hub.docker.com/milvusdb/milvus:v3.0.2@sha256:5f13bf88e110a517911c3e6dd8172454e90042c21e606a868084615a4302c8a0
    user: '0:0'
    network_mode: none
    entrypoint: [/bin/sh, -c]
    command:
      - 'chown -R "$$(id -u milvus):$$(id -g milvus)" /var/lib/milvus'
    volumes:
      - enterprise_milvus_data:/var/lib/milvus
    restart: 'no'

  milvus:
    image: registry.hub.docker.com/milvusdb/milvus:v3.0.2@sha256:5f13bf88e110a517911c3e6dd8172454e90042c21e606a868084615a4302c8a0
    container_name: enterprise-knowledge-milvus
    command: [milvus, run, standalone]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: milvus-etcd:2379
      MINIO_ADDRESS: milvus-minio:9000
      MQ_TYPE: woodpecker
      MINIO_REGION: us-east-1
      # Equivalent to common.security.authorizationEnabled in milvus.yaml.
      COMMON_SECURITY_AUTHORIZATIONENABLED: "true"
    volumes:
      - enterprise_milvus_data:/var/lib/milvus
    ports:
      - '127.0.0.1:19531:19530'
    depends_on:
      milvus-volume-init:
        condition: service_completed_successfully
      milvus-etcd:
        condition: service_healthy
      milvus-minio:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, -f, http://localhost:9091/healthz]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:8.2.10-alpine
    container_name: enterprise-knowledge-redis
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.4
    container_name: enterprise-knowledge-keycloak
    command:
      - start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:9000:9000"
    volumes:
      - keycloak_data:/opt/keycloak/data
    mem_limit: 1g
    restart: unless-stopped

  milvus-init:
    build:
      context: .
    # Read host secrets (0600 on Linux), then publish per-service 0400 files
    # owned by the non-root app user in separate credential volumes.
    user: '0:0'
    env_file:
      - .env
    environment:
      MILVUS_URI: http://milvus:19530
      MILVUS_TOKEN: ""
      MILVUS_TOKEN_FILE: /run/secrets/milvus_worker_token
      MILVUS_WORKER_TOKEN_FILE: /run/secrets/milvus_worker_token
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    secrets:
      - milvus_admin_token
      - milvus_api_token
      - milvus_worker_token
    volumes:
      - enterprise_milvus_api_credential:/run/milvus-api-credential
      - enterprise_milvus_worker_credential:/run/milvus-worker-credential
    command:
      - sh
      - -c
      - >
        python scripts/bootstrap_milvus.py --allow-default-root --publish-service-secrets &&
        alembic upgrade head &&
        exec python scripts/sync_vectors.py --require-imports
    depends_on:
      milvus:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      disable: true
    restart: 'no'

  api:
    build:
      context: .
    container_name: enterprise-knowledge-api
    env_file:
      - .env
    environment:
      MILVUS_URI: http://milvus:19530
      MILVUS_TOKEN: ""
      MILVUS_TOKEN_FILE: /run/milvus-credential/token
      MILVUS_WORKER_TOKEN_FILE: ""
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      OIDC_JWKS_URL: http://keycloak:8080/realms/enterprise-knowledge/protocol/openid-connect/certs
      DOCUMENT_STORAGE_DIR: /app/data/documents
    command:
      - sh
      - -c
      - >
        exec python -m uvicorn backend.app.main:app
        --host 0.0.0.0
        --port 8000
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - enterprise_document_data:/app/data/documents
      - enterprise_milvus_api_credential:/run/milvus-credential:ro
    depends_on:
      milvus-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
    restart: unless-stopped

  worker:
    build:
      context: .
    container_name: enterprise-knowledge-worker
    env_file:
      - .env
    environment:
      MILVUS_URI: http://milvus:19530
      MILVUS_TOKEN: ""
      MILVUS_TOKEN_FILE: /run/milvus-credential/token
      MILVUS_WORKER_TOKEN_FILE: /run/milvus-credential/token
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DOCUMENT_STORAGE_DIR: /app/data/documents
    command:
      - python
      - scripts/run_indexing_worker.py
    expose:
      - "9101"
    volumes:
      - enterprise_document_data:/app/data/documents
      - enterprise_milvus_worker_credential:/run/milvus-credential:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "scripts/check_indexing_worker_health.py"
        ]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3
    restart: unless-stopped

  quality-worker:
    build:
      context: .
    profiles: ["quality"]
    env_file:
      - .env
    environment:
      MILVUS_URI: http://milvus:19530
      MILVUS_TOKEN: ""
      MILVUS_TOKEN_FILE: /run/milvus-credential/token
      MILVUS_WORKER_TOKEN_FILE: ""
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    command: ["python", "scripts/run_quality_worker.py", "--allow-model-calls"]
    volumes:
      - enterprise_milvus_api_credential:/run/milvus-credential:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      disable: true
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.14.0
    container_name: enterprise-knowledge-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - enterprise_prometheus_data:/prometheus
    depends_on:
      api:
        condition: service_healthy
      alertmanager:
        condition: service_healthy
    restart: unless-stopped

  alert-webhook:
    build:
      context: .
    container_name: enterprise-knowledge-alert-webhook
    env_file:
      - path: .env.alerting
        required: false
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    command:
      - python
      - -m
      - uvicorn
      - backend.app.alert_webhook_gateway:app
      - --host
      - 0.0.0.0
      - --port
      - "8090"
    ports:
      - "127.0.0.1:8090:8090"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=3)"
        ]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.34.1
    container_name: enterprise-knowledge-alertmanager
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --web.listen-address=0.0.0.0:9093
      - --cluster.listen-address=
      - --enable-feature=utf8-strict-mode
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - enterprise_alertmanager_data:/alertmanager
    depends_on:
      alert-webhook:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--spider",
          "-q",
          "http://127.0.0.1:9093/-/ready"
        ]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped

  loki:
    image: grafana/loki:3.7.3
    container_name: enterprise-knowledge-loki
    command:
      - -config.file=/etc/loki/config.yml
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./monitoring/loki.yml:/etc/loki/config.yml:ro
      - enterprise_loki_data:/loki
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.20.0
    container_name: enterprise-knowledge-alloy
    user: "0"
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    ports:
      - "127.0.0.1:12345:12345"
    volumes:
      - ./monitoring/alloy.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - enterprise_alloy_data:/var/lib/alloy/data
    depends_on:
      loki:
        condition: service_started
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.3
    container_name: enterprise-knowledge-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - enterprise_grafana_data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_started
      loki:
        condition: service_started
    restart: unless-stopped

secrets:
  milvus_admin_token:
    file: ./.secrets/milvus/admin_token
  milvus_api_token:
    file: ./.secrets/milvus/api_token
  milvus_worker_token:
    file: ./.secrets/milvus/worker_token

volumes:
  enterprise_postgres_data:
  keycloak_data:
  enterprise_document_data:
  enterprise_prometheus_data:
  enterprise_grafana_data:
  enterprise_alertmanager_data:
  enterprise_loki_data:
  enterprise_alloy_data:
  enterprise_milvus_etcd:
  enterprise_milvus_minio:
  enterprise_milvus_data:
  enterprise_milvus_api_credential:
  enterprise_milvus_worker_credential:
