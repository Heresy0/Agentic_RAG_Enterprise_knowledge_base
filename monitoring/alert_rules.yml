groups:
  - name: enterprise-knowledge
    rules:
      - alert: MilvusUnavailable
        expr: enterprise_vector_store_up{job="enterprise-knowledge-api"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Milvus 向量集合不可用
          description: 检查 Milvus、etcd、对象存储及集合加载状态。

      - alert: VectorSyncFailed
        expr: enterprise_vector_sync_jobs{job="enterprise-knowledge-api",status="failed"} > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: Milvus 同步任务达到重试上限
          description: 排除故障后运行 scripts/sync_vectors.py --retry-failed --audit。

      - alert: IndexingWorkerUnavailable
        expr: up{job="enterprise-knowledge-worker"} == 0 or enterprise_indexing_workers_active{job="enterprise-knowledge-api"} < 1
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: 索引 Worker 不可用
          description: 超过一分钟没有检测到有效的索引 Worker 心跳。

      - alert: IndexingQueueBacklog
        expr: enterprise_indexing_queue_jobs{job="enterprise-knowledge-api",status="queued"} > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 索引任务持续积压
          description: 排队中的索引任务连续五分钟超过十个。

      - alert: IndexingFailuresDetected
        expr: increase(enterprise_indexing_jobs_total{job="enterprise-knowledge-worker",outcome="failed"}[10m]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: 检测到索引任务最终失败
          description: 最近十分钟出现了达到重试上限的索引任务。

      - alert: QaP95LatencyHigh
        expr: histogram_quantile(0.95, sum by (le) (rate(enterprise_qa_request_duration_seconds_bucket{job="enterprise-knowledge-api",outcome="completed"}[5m]))) > 15
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: QA P95 延迟过高
          description: 知识库问答 P95 延迟连续五分钟超过十五秒。

      - alert: ModelUsageAuditWriteFailed
        expr: sum by (job, operation) (increase(enterprise_model_usage_write_failures_total[5m])) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: 模型用量审计写入失败
          description: 模型调用可能已发生费用，但独立审计写入失败；请检查数据库、日志和长期 pending 事件。

      # Windowed ratios require a minimum sample count; low-traffic demos stay quiet.
      - alert: RagRepairFailuresHigh
        expr: |
          ((sum(increase(enterprise_rag_repairs_total{job="enterprise-knowledge-api",outcome=~"rejected|fallback"}[15m])) or vector(0)) / clamp_min(sum(increase(enterprise_rag_repairs_total{job="enterprise-knowledge-api",outcome=~"model_repaired|rejected|fallback"}[15m])), 1) > 0.3)
          and (sum(increase(enterprise_rag_repairs_total{job="enterprise-knowledge-api",outcome=~"model_repaired|rejected|fallback"}[15m])) >= 10)
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: RAG 修复异常或拒绝比例升高
          description: 最近15分钟至少10次模型修复结果中，异常或未通过校验比例超过30%并持续5分钟。先检查修复诊断、供应商输出及共享预算；不是自动放宽最终校验的依据。

      - alert: RagFeedbackRefusalsHigh
        expr: |
          ((sum(increase(enterprise_rag_feedback_final_total{job="enterprise-knowledge-api",answerable="false"}[15m])) or vector(0)) / clamp_min(sum(increase(enterprise_rag_feedback_final_total{job="enterprise-knowledge-api"}[15m])), 1) > 0.8)
          and (sum(increase(enterprise_rag_feedback_final_total{job="enterprise-knowledge-api"}[15m])) >= 10)
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 补查再生成后仍拒答比例升高
          description: 最近15分钟至少10个已接受补查再生成的最终结果中，拒答比例超过80%并持续5分钟。检查知识覆盖和无效补查成本；正确拒答也计入，不等于答案错误。

      - alert: RagSharedBudgetLimitedHigh
        expr: |
          ((sum(increase(enterprise_rag_budget_requests_total{job="enterprise-knowledge-api",outcome="limited"}[15m])) or vector(0)) / clamp_min(sum(increase(enterprise_rag_budget_requests_total{job="enterprise-knowledge-api"}[15m])), 1) > 0.2)
          and (sum(increase(enterprise_rag_budget_requests_total{job="enterprise-knowledge-api"}[15m])) >= 20)
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: RAG 共享预算受限请求比例升高
          description: 最近15分钟至少20个进入问答服务的请求中，共享预算实际拦截可选步骤的比例超过20%并持续5分钟。按 reason 检查调用、tokens、耗时及工具配额；先分析再调整。

      - alert: RagValidationRefusalsHigh
        expr: |
          ((sum(increase(enterprise_rag_terminal_results_total{job="enterprise-knowledge-api",stage="validation",answerable="false"}[15m])) or vector(0)) / clamp_min(sum(increase(enterprise_rag_terminal_results_total{job="enterprise-knowledge-api"}[15m])), 1) > 0.2)
          and (sum(increase(enterprise_rag_terminal_results_total{job="enterprise-knowledge-api"}[15m])) >= 20)
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: RAG 最终校验拒答比例升高
          description: 最近15分钟至少20个产生最终结果的请求中，引用、覆盖或计算校验拒答比例超过20%并持续5分钟。检查模型草稿和证据绑定；该指标不能独立判定误拒答。
